name: Sandbox Kit

on:
  push:
    branches: [main]
    paths:
      - sandbox-kit/**
      - .github/workflows/sandbox-kit.yml
  pull_request:
    branches: [main]
    paths:
      - sandbox-kit/**
      - .github/workflows/sandbox-kit.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mekugi-harness/mekugi-dev

jobs:
  build:
    name: Build and publish sandbox kit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract kit metadata
        id: meta
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?.*$/\1/p' sandbox-kit/mekugi-dev.yaml | head -n 1)
          test -n "$version"
          short_sha=$(git rev-parse --short=12 HEAD)
          {
            echo "version=$version"
            echo "short_sha=$short_sha"
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${version}"
            echo "${IMAGE}:sha-${short_sha}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify sandbox kit (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox-kit
          file: sandbox-kit/mekugi-dev.yaml
          platforms: linux/amd64,linux/arm64
          provenance: mode=min
          sbom: false
          push: false
          outputs: type=oci,dest=/tmp/mekugi-dev-oci,tar=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify exported OCI kit annotations (PR)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          index_digest=$(jq -r '.manifests[0].digest | sub("^sha256:"; "")' /tmp/mekugi-dev-oci/index.json)
          index_blob="/tmp/mekugi-dev-oci/blobs/sha256/${index_digest}"
          jq -e '.annotations["vnd.docker.sandbox.kit.descriptor"] | fromjson | .schemaVersion == "3" and .kind == "workload"' "$index_blob" >/dev/null
          for arch in amd64 arm64; do
            manifest_digest=$(jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest | sub("^sha256:"; "")' "$index_blob")
            test -n "$manifest_digest"
            jq -e '.annotations["vnd.docker.sandbox.kit.descriptor"] | fromjson | .schemaVersion == "3" and .kind == "workload"' "/tmp/mekugi-dev-oci/blobs/sha256/${manifest_digest}" >/dev/null
          done

      - name: Build and publish sandbox kit to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox-kit
          file: sandbox-kit/mekugi-dev.yaml
          platforms: linux/amd64,linux/arm64
          provenance: mode=min
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published GHCR kit annotations
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ref="${IMAGE}:sha-${{ steps.meta.outputs.short_sha }}"
          index=$(docker buildx imagetools inspect --raw "$ref")
          printf '%s\n' "$index" | jq -e '.annotations["vnd.docker.sandbox.kit.descriptor"] | fromjson | .schemaVersion == "3" and .kind == "workload"' >/dev/null
          for arch in amd64 arm64; do
            digest=$(printf '%s\n' "$index" | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            test -n "$digest"
            docker buildx imagetools inspect --raw "${IMAGE}@${digest}" \
              | jq -e '.annotations["vnd.docker.sandbox.kit.descriptor"] | fromjson | .schemaVersion == "3" and .kind == "workload"' >/dev/null
          done
